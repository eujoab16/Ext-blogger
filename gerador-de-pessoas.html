<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Pessoas</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { color: #38bdf8; text-align: center; margin-bottom: 24px; }
    
    .link-voltar {
      display: inline-block;
      color: #818cf8;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .link-voltar:hover { text-decoration: underline; }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .campo {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 0.95rem;
      outline: none;
    }

    button {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }

    button:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  <a href="../index.html" class="link-voltar">&larr; Voltar ao Painel</a>

  <h1>Gerador de Pessoa</h1>

  <button onclick="gerarPessoa()">Gerar Novas Informações</button>

  <div class="card">
    <div class="campo">
      <label>Nome Completo:</label>
      <input type="text" id="nome" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>CPF:</label>
      <input type="text" id="cpf" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>RG:</label>
      <input type="text" id="rg" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>Data de Nascimento:</label>
      <input type="text" id="nascimento" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>E-mail:</label>
      <input type="text" id="email" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>Telefone / Celular:</label>
      <input type="text" id="telefone" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>CEP:</label>
      <input type="text" id="cep" readonly onclick="this.select()">
    </div>
    <div class="campo">
      <label>Cidade / UF:</label>
      <input type="text" id="cidade" readonly onclick="this.select()">
    </div>
  </div>

  <script>
    const nomes = ["Carlos", "Ana", "Bruno", "Mariana", "Lucas", "Fernanda", "Gabriel", "Beatriz", "Rodrigo", "Camila"];
    const sobrenomes = ["Silva", "Souza", "Oliveira", "Santos", "Lima", "Ferreira", "Costa", "Rodrigues", "Almeida", "Nascimento"];
    const cidades = ["São Paulo / SP", "Rio de Janeiro / RJ", "Belo Horizonte / MG", "Curitiba / PR", "Salvador / BA", "Recife / PE", "Maceió / AL", "Porto Alegre / RS"];
    const provedores = ["gmail.com", "hotmail.com", "outlook.com", "yahoo.com"];

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pad(num, size) {
      return num.toString().padStart(size, '0');
    }

    function gerarPessoa() {
      const nome = nomes[rand(0, nomes.length - 1)];
      const sobrenome1 = sobrenomes[rand(0, sobrenomes.length - 1)];
      const sobrenome2 = sobrenomes[rand(0, sobrenomes.length - 1)];
      const nomeCompleto = `${nome} ${sobrenome1} ${sobrenome2}`;

      const cpf = `${pad(rand(100, 999), 3)}.${pad(rand(100, 999), 3)}.${pad(rand(100, 999), 3)}-${pad(rand(10, 99), 2)}`;
      const rg = `${pad(rand(10, 99), 2)}.${pad(rand(100, 999), 3)}.${pad(rand(100, 999), 3)}-${rand(0, 9)}`;
      
      const dia = pad(rand(1, 28), 2);
      const mes = pad(rand(1, 12), 2);
      const ano = rand(1970, 2004);
      const nascimento = `${dia}/${mes}/${ano}`;

      const email = `${nome.toLowerCase()}.${sobrenome1.toLowerCase()}${rand(10, 99)}@${provedores[rand(0, provedores.length - 1)]}`;
      const telefone = `(${rand(11, 99)}) 9${rand(1000, 9999)}-${rand(1000, 9999)}`;
      const cep = `${rand(10, 99)}${rand(100, 999)}-${rand(100, 999)}`;
      const cidade = cidades[rand(0, cidades.length - 1)];

      document.getElementById('nome').value = nomeCompleto;
      document.getElementById('cpf').value = cpf;
      document.getElementById('rg').value = rg;
      document.getElementById('nascimento').value = nascimento;
      document.getElementById('email').value = email;
      document.getElementById('telefone').value = telefone;
      document.getElementById('cep').value = cep;
      document.getElementById('cidade').value = cidade;
    }

    // Gerar automaticamente ao carregar a página
    gerarPessoa();
  </script>

</body>
</html>
