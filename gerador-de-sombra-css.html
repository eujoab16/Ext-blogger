<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Sombras CSS</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { color: #38bdf8; text-align: center; margin-bottom: 24px; }
    
    .link-voltar {
      display: inline-block;
      color: #818cf8;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .link-voltar:hover { text-decoration: underline; }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    /* Área de Preview da Sombra */
    .preview-container {
      width: 100%;
      height: 150px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .box-target {
      width: 100px;
      height: 100px;
      background: #38bdf8;
      border-radius: 8px;
      transition: box-shadow 0.1s ease;
    }

    .campo {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .controles-cor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
      box-sizing: border-box;
    }

    textarea {
      width: 100%;
      height: 60px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
      resize: none;
    }

    button.btn-copiar {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button.btn-copiar:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  <a href="../index.html" class="link-voltar">&larr; Voltar ao Painel</a>

  <h1>Gerador de Sombras CSS</h1>

  <div class="card">
    <div class="preview-container">
      <div id="box-preview" class="box-target"></div>
    </div>

    <div class="campo">
      <label>Deslocamento X: <strong id="val-x" style="color: #38bdf8;">10px</strong></label>
      <input type="range" id="x" min="-50" max="50" value="10" oninput="atualizarSombra()">
    </div>

    <div class="campo">
      <label>Deslocamento Y: <strong id="val-y" style="color: #38bdf8;">10px</strong></label>
      <input type="range" id="y" min="-50" max="50" value="10" oninput="atualizarSombra()">
    </div>

    <div class="campo">
      <label>Desfoque (Blur): <strong id="val-blur" style="color: #38bdf8;">20px</strong></label>
      <input type="range" id="blur" min="0" max="100" value="20" oninput="atualizarSombra()">
    </div>

    <div class="campo">
      <label>Espalhamento (Spread): <strong id="val-spread" style="color: #38bdf8;">0px</strong></label>
      <input type="range" id="spread" min="-30" max="50" value="0" oninput="atualizarSombra()">
    </div>

    <div class="controles-cor">
      <div class="campo">
        <label>Cor da Sombra:</label>
        <input type="color" id="cor-sombra" value="#000000" oninput="atualizarSombra()">
      </div>
      <div class="campo">
        <label>Opacidade: <strong id="val-opacidade" style="color: #38bdf8;">40%</strong></label>
        <input type="range" id="opacidade" min="0" max="100" value="40" oninput="atualizarSombra()">
      </div>
    </div>

    <div class="campo">
      <label>Código CSS:</label>
      <textarea id="resultado" readonly onclick="this.select()"></textarea>
    </div>

    <button class="btn-copiar" onclick="copiarCodigo()">Copiar Código CSS</button>
  </div>

  <script>
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 0, g: 0, b: 0 };
    }

    function atualizarSombra() {
      const x = document.getElementById('x').value;
      const y = document.getElementById('y').value;
      const blur = document.getElementById('blur').value;
      const spread = document.getElementById('spread').value;
      const hex = document.getElementById('cor-sombra').value;
      const opacidade = (document.getElementById('opacidade').value / 100).toFixed(2);

      document.getElementById('val-x').innerText = `${x}px`;
      document.getElementById('val-y').innerText = `${y}px`;
      document.getElementById('val-blur').innerText = `${blur}px`;
      document.getElementById('val-spread').innerText = `${spread}px`;
      document.getElementById('val-opacidade').innerText = `${Math.round(opacidade * 100)}%`;

      const rgb = hexToRgb(hex);
      const boxShadowValue = `${x}px ${y}px ${blur}px ${spread}px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacidade})`;
      const cssString = `box-shadow: ${boxShadowValue};`;

      document.getElementById('box-preview').style.boxShadow = boxShadowValue;
      document.getElementById('resultado').value = cssString;
    }

    function copiarCodigo() {
      const campo = document.getElementById('resultado');
      campo.select();
      navigator.clipboard.writeText(campo.value);
      alert('Código CSS copiado!');
    }

    // Inicializar ao carregar
    atualizarSombra();
  </script>

</body>
</html>
