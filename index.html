<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogger Studio Pro</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { color: #38bdf8; text-align: center; }
    h2 { color: #818cf8; font-size: 1.1rem; margin-top: 20px; }

    /* Estilo dos itens de cópia (details) */
    details {
      background: #1e293b;
      margin-bottom: 8px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    summary { cursor: pointer; font-weight: 500; }

    textarea {
      width: 100%;
      height: 70px;
      margin-top: 8px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px;
      box-sizing: border-box;
      font-family: monospace;
      resize: vertical;
    }

    /* Estilo dos links para as ferramentas */
    .link-ferramenta {
      display: block;
      background: #1e293b;
      color: #f8fafc;
      text-decoration: none;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: background 0.2s;
    }

    .link-ferramenta:hover {
      background: #334155;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h1>Blogger Studio Pro</h1>

  <!-- SEÇÃO 1: CÓDIGOS PARA COPIAR -->
  <h2>Códigos Rápidos</h2>

  <details>
    <summary>Template Zerado sem Post</summary>
    <textarea readonly onclick="this.select()"><?xml version="1.0" encoding="UTF-8" ?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title><data:blog.pageTitle/></title></head>
<body></body>
</html></textarea>
  </details>

  <details>
    <summary>Template Zerado com Post</summary>
    <textarea readonly onclick="this.select()"><b:section id="Posts"><b:widget id="Blog1" type="Blog"/></b:section></textarea>
  </details>

  <details>
    <summary>Link CDN Font Awesome (Head)</summary>
    <textarea readonly onclick="this.select()"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/></textarea>
  </details>

  <!-- SEÇÃO 2: LINKS PARA AS FERRAMENTAS INDIVIDUAIS -->
  <h2>Ferramentas</h2>

  <a target='_blank' href="Ext-blogger/gerador-de-pessoas.html" class="link-ferramenta">Gerador de Pessoa</a>
  <a target='_blank' href="Ext-blogger/gerador-de-senha.html" class="link-ferramenta">Gerador de Senhas</a>
  <a target='_blank' href="Ext-blogger/organizador-de-codigo.html" class="link-ferramenta">Formatador de Código</a>
  <a target='_blank' href="Ext-blogger/seletor-de-cores.html" class="link-ferramenta">Seletor de Cores</a>
  <a target='_blank' href="Ext-blogger/gerador-de-sombra.html" class="link-ferramenta">Gerador de Sombras CSS</a>
  <a target='_blank' href="Ext-blogger/gerador-de-link-whatsapp.html" class="link-ferramenta">Gerador de Link WhatsApp</a>

</body>
</html>
