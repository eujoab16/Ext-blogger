<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Código (HTML/CSS/JS)</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { color: #38bdf8; text-align: center; margin-bottom: 24px; }
    
    .link-voltar {
      display: inline-block;
      color: #818cf8;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .link-voltar:hover { text-decoration: underline; }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .campo {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 0.85rem;
      outline: none;
      resize: vertical;
    }

    .botoes-acao {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #4338ca; }

    button.btn-copiar { background: #10b981; }
    button.btn-copiar:hover { background: #059669; }
  </style>
</head>
<body>

  <a href="../index.html" class="link-voltar">&larr; Voltar ao Painel</a>

  <h1>Formatador de Código</h1>

  <div class="card">
    <div class="campo">
      <label>Cole seu código aqui (HTML, CSS ou JS):</label>
      <textarea id="input-codigo" placeholder="Cole seu código desorganizado aqui..."></textarea>
    </div>

    <div class="botoes-acao">
      <button onclick="formatar()">Organizar Código</button>
      <button onclick="limpar()">Limpar</button>
    </div>

    <div class="campo">
      <label>Código Formatado:</label>
      <textarea id="res-codigo" readonly onclick="this.select()" placeholder="O resultado aparecerá aqui..."></textarea>
    </div>

    <button class="btn-copiar" style="width: 100%;" onclick="copiar()">Copiar Código Formatado</button>
  </div>

  <script>
    function formatar() {
      let cod = document.getElementById('input-codigo').value;
      if (!cod.trim()) return;

      // Limpeza geral de espaços extras
      cod = cod.trim().replace(/\r\n/g, "\n");

      // Identifica se é HTML ou CSS/JS básico
      if (cod.includes("<") && cod.includes(">")) {
        // Formatação simples para HTML (adiciona quebra entre tags)
        cod = cod.replace(/>\s*</g, ">\n<");
      } else {
        // Formatação simples para CSS/JS (quebra em chaves e ponto-e-vírgula)
        cod = cod.replace(/;\s*/g, ";\n")
                 .replace(/{\s*/g, " {\n  ")
                 .replace(/}\s*/g, "\n}\n");
      }

      // Aplicação de indentação básica de 2 espaços
      let linhas = cod.split("\n");
      let indent = 0;
      let resultado = [];

      linhas.forEach(linha => {
        let l = linha.trim();
        if (!l) return;

        // Diminui recuo para fechamento de bloco ou tag
        if (l.startsWith("}") || l.startsWith("</")) {
          indent = Math.max(0, indent - 1);
        }

        resultado.push("  ".repeat(indent) + l);

        // Aumenta recuo para abertura de bloco
        if (l.endsWith("{") || (l.startsWith("<") && !l.startsWith("</") && !l.endsWith("/>") && !l.includes("</"))) {
          indent++;
        }
      });

      document.getElementById('res-codigo').value = resultado.join("\n");
    }

    function limpar() {
      document.getElementById('input-codigo').value = '';
      document.getElementById('res-codigo').value = '';
    }

    function copiar() {
      const res = document.getElementById('res-codigo');
      if (res.value) {
        res.select();
        navigator.clipboard.writeText(res.value);
        alert('Código formatado copiado!');
      }
    }
  </script>

</body>
</html>
